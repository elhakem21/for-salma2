<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: #050505; color: #ff3e3e; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        .system-box { border: 1px solid #ff3e3e; padding: 15px; position: absolute; top: 20px; right: 20px; width: 280px; background: rgba(0,0,0,0.8); z-index: 10; }
        .log-area { position: absolute; bottom: 20px; left: 20px; width: 300px; border: 1px solid #ff3e3e; padding: 15px; background: rgba(0,0,0,0.8); font-size: 13px; z-index: 10; }
        canvas { display: block; }
        .center-s { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; color: white; text-shadow: 0 0 20px #ff3e3e; z-index: 5; }
    </style>
</head>
<body>

<div class="system-box">
    [نظام تحليل ملف: سلمى]<br>
    العمق العاطفي: 100%<br>
    الحالة: مرتبطة بـ S
</div>

<div class="center-s">S</div>

<div class="log-area">
    > سلمى.. يا أجدع واحدة عرفتها.<br>
    > طيبة بزيادة وأحلى هبلة قابلتها.<br>
    > بتغلبني وتجنني بس حنيتها مفيش زيها.<br>
    > غبية شوية بس بموت فيها.. دي دنيتي.
</div>

<canvas id="heartCanvas"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function animate() {
        ctx.fillStyle = "rgba(5, 5, 5, 0.1)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#ff3e3e";
        ctx.font = "14px Courier New";
        
        for(let i=0; i<60; i++) {
            let t = (i/60) * Math.PI * 2;
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            ctx.fillText("Love", canvas.width/2 + x*25, canvas.height/2 + y*25);
        }
        requestAnimationFrame(animate);
    }
    animate();
</script>

</body>
</html>
